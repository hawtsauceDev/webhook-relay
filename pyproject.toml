[project]
name = "webhook-relay"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "hawtsauceDev", email = "hawtsauce0325@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "psycopg2>=2.9.13",
    "python-dotenv>=1.2.3",
